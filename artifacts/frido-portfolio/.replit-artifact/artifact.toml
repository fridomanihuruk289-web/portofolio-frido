kind = "web"
previewPath = "/"
title = "Frido Evindey Manihuruk — Portfolio"
description = "Portofolio profesional satu halaman untuk Frido Evindey Manihuruk, kandidat Champion Trainee di bidang Supply Chain Management, dengan pengalaman analisis data, riset ekonomi, organisasi, dan proyek forecasting."
version = "1.0.0"
id = "artifacts/frido-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21859

[services.development]
run = "pnpm --filter @workspace/frido-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/frido-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/frido-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21859"
BASE_PATH = "/"
